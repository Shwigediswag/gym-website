    story:
        heading_1: 'No membership card.'
        heading_2: 'An appointment.'
        p1: 'At a regular gym you walk in whenever you like, and nobody walks with you. At Gym it works the other way round: you fix your hours — for a week, or for the rest of the season — and we make sure your group and your trainer are there at that hour.'
        p2: 'You train with the same [five] people. Your trainer knows your neck is sensitive and that you always come in tired on Tuesdays. That is not an extra, that is the whole idea.'
        link: 'Read our story'
    offer:
        group:
            photo: '[Photo: small group]'
            title: 'Small group'
            text: 'Max. %max% people, a fixed group, a fixed trainer. 60 minutes.'
            price: 'from %price% / month'
