about:
    title: 'About us'
    label: 'About us'
    intro: 'Gym started out of frustration with anonymous gyms. We wanted a place where your trainer knows who you are, where your group is waiting for you, and where your right knee is taken as seriously as your goal.'
    founder:
        photo: '[Photo: founder(s) in the studio, relaxed portrait]'
        heading: 'Why we started Gym'
        p1_placeholder: '[The founder''s story: who you are, how long you have been a trainer, what you saw going wrong in big gyms, and the moment you decided to do it differently. Two paragraphs, first person.]'
        p2_placeholder: '[Second paragraph: how the studio in %city% came about, when the doors open and what you hope members find here.]'
        signature_placeholder: '[Founder''s name]'
    beliefs:
        label: 'What we believe in'
        heading: 'Three things we never let go of'
        b1:
            title: 'By appointment, never walk-in'
            text: 'Every hour is planned, every spot belongs to someone. That way your trainer knows exactly who is coming and the session can be prepared for you.'
        b2:
            title: 'At most %max%, always the same'
            text: 'A group is only a group when you know each other. That is why we do not reshuffle every week, and why we notice when you are missing.'
        b3:
            title: 'One trainer, for the long term'
            text: 'Progress is personal and slow. You can only follow it when the same person sees you month after month.'
    team:
        heading: 'The trainers'
        intro: 'You choose your trainer at the intro session and after that it stays the same person. Here they are.'
    cta:
        heading: 'Come and meet us. And your group.'
        text: 'Half an hour in the studio, free and without obligation.'

